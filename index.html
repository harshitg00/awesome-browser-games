<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Awesome Browser Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
  <!-- Tailwind CSS CDN for instant modern styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Marked.js for parsing markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
      <h1 class="text-2xl font-bold tracking-tight text-emerald-400">🎮 Awesome Browser Games</h1>
      <a href="https://github.com/harshitg00/awesome-browser-games/" target="_blank" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold px-4 py-2 rounded-lg border border-slate-700 transition">
        View on GitHub ↗
      </a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">

    <!-- Search and Controls Bar -->
    <div class="bg-slate-800/60 p-4 rounded-xl border border-slate-700/50 mb-8 space-y-4 sm:space-y-0 sm:flex sm:gap-4">
      
      <!-- Text Search (Name, Description, Tags) -->
      <div class="flex-1">
        <label for="search" class="sr-only">Search</label>
        <input type="text" id="search" placeholder="Search by name, description, or #tag..." 
               class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 placeholder-slate-500">
      </div>

      <!-- Category Filter -->
      <div class="sm:w-64">
        <select id="categoryFilter" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
          <option value="ALL">All Categories</option>
        </select>
      </div>
    </div>

    <!-- Active Tag Banner (Hidden by default) -->
    <div id="activeTagContainer" class="hidden mb-6 flex items-center gap-2 text-sm text-slate-400">
      <span>Filtering by tag:</span>
      <span id="activeTag" class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full text-xs font-mono"></span>
      <button id="clearTagBtn" class="text-slate-500 hover:text-slate-300 ml-2 text-xs font-semibold">✕ Clear Tag Filter</button>
    </div>

    <!-- Games Grid Container -->
    <div id="gamesContainer" class="space-y-12">
      <div class="text-center text-slate-500 py-12">Loading games directory...</div>
    </div>

  </main>

  <script>
    const RAW_README_URL = 'https://raw.githubusercontent.com/harshitg00/awesome-browser-games/main/README.md';

    let allGames = [];
    let categories = new Set();
    let currentTagFilter = null;

    // Fetch and Initialize Data
    async function loadDirectory() {
      try {
        const response = await fetch(RAW_README_URL);
        const markdown = await response.text();
        parseMarkdownTables(markdown);
        populateCategoryDropdown();
        renderGames();
      } catch (err) {
        // Fallback for local testing or raw fetch errors
        document.getElementById('gamesContainer').innerHTML = `
          <div class="text-center text-rose-400 py-12">
            Failed to load README.md. Make sure <code>RAW_README_URL</code> points to your GitHub repository!
          </div>`;
      }
    }

    // Parse Markdown Tables into Data Structure
    function parseMarkdownTables(markdown) {
      const lines = markdown.split('\n');
      let currentSection = 'Uncategorized';

      lines.forEach(line => {
        const trimmed = line.trim();

        // Detect Headings (H2 / H3)
        if (trimmed.startsWith('# ') || trimmed.startsWith('## ') || trimmed.startsWith('### ')) {
          const headingText = trimmed.replace(/^#+\s*/, '').replace(/\[(.*?)\]\(.*?\)/g, '$1').trim();
          if (headingText !== 'Table of Contents' && headingText !== 'Contributing') {
            currentSection = headingText;
            categories.add(currentSection);
          }
        }

        // Detect Table Rows (ignoring headers & separators)
        if (trimmed.startsWith('|') && !trimmed.includes('---') && !trimmed.toLowerCase().includes('game name')) {
          const cols = trimmed.split('|').map(c => c.trim()).filter((_, index, array) => index !== 0 && index !== array.length - 1);
          
          if (cols.length >= 3) {
            const rawName = cols[0].replace(/\*\*/g, '').trim();
            const link = cols[1].trim();
            const description = cols[2].trim();
            const tagsRaw = cols[3] || '';

            // Extract tags like `#tag`
            const tags = tagsRaw.match(/#[a-z0-9_\-]+/gi) || [];
            allGames.push({
              name: rawName,
              link: link,
              description: description,
              tags: tags.map(t => t.toLowerCase()),
              category: currentSection
            });
          }
        }
      });
    }

    // Populate Category Dropdown
    function populateCategoryDropdown() {
      const select = document.getElementById('categoryFilter');
      categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        select.appendChild(option);
      });
    }

    // Render Games Grid
    function renderGames() {
      const searchQuery = document.getElementById('search').value.toLowerCase();
      const selectedCategory = document.getElementById('categoryFilter').value;
      const container = document.getElementById('gamesContainer');

      container.innerHTML = '';

      // Filter Games
      const filtered = allGames.filter(game => {
        const matchesSearch = game.name.toLowerCase().includes(searchQuery) ||
                              game.description.toLowerCase().includes(searchQuery) ||
                              game.tags.some(t => t.includes(searchQuery));
        
        const matchesCategory = selectedCategory === 'ALL' || game.category === selectedCategory;
        const matchesTag = !currentTagFilter || game.tags.includes(currentTagFilter.toLowerCase());

        return matchesSearch && matchesCategory && matchesTag;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center text-slate-500 py-12">No games found matching your filters.</div>`;
        return;
      }

      // Group filtered games by Category
      const grouped = {};
      filtered.forEach(game => {
        if (!grouped[game.category]) grouped[game.category] = [];
        grouped[game.category].push(game);
      });

      // Build HTML Output
      Object.keys(grouped).forEach(cat => {
        const section = document.createElement('section');
        section.className = 'space-y-4';

        const title = document.createElement('h2');
        title.className = 'text-xl font-semibold text-slate-200 border-b border-slate-800 pb-2';
        title.textContent = cat;
        section.appendChild(title);

        const grid = document.createElement('div');
        grid.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4';

        grouped[cat].forEach(game => {
          const card = document.createElement('div');
          card.className = 'bg-slate-800/40 border border-slate-700/60 rounded-xl p-5 flex flex-col justify-between hover:border-emerald-500/50 transition duration-200 group';

          const tagsHtml = game.tags.map(t => 
            `<button onclick="setTagFilter('${t}')" class="text-xs font-mono bg-slate-900/80 text-emerald-400 hover:bg-emerald-500/20 px-2 py-1 rounded border border-slate-700/80 transition">${t}</button>`
          ).join(' ');

          card.innerHTML = `
            <div>
              <div class="flex items-start justify-between gap-2 mb-2">
                <h3 class="font-bold text-lg text-slate-100 group-hover:text-emerald-400 transition">${game.name}</h3>
              </div>
              <p class="text-sm text-slate-400 mb-4 leading-relaxed">${game.description}</p>
            </div>
            <div class="space-y-4 pt-2">
              <div class="flex flex-wrap gap-1.5">${tagsHtml}</div>
              <a href="${game.link}" target="_blank" rel="noopener noreferrer" 
                 class="block w-full text-center bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-sm py-2 rounded-lg transition shadow-lg shadow-emerald-900/20">
                Play Now ↗
              </a>
            </div>
          `;
          grid.appendChild(card);
        });

        section.appendChild(grid);
        container.appendChild(section);
      });
    }

    // Set & Clear Tag Filter
    function setTagFilter(tag) {
      currentTagFilter = tag;
      document.getElementById('activeTag').textContent = tag;
      document.getElementById('activeTagContainer').classList.remove('hidden');
      renderGames();
    }

    document.getElementById('clearTagBtn').addEventListener('click', () => {
      currentTagFilter = null;
      document.getElementById('activeTagContainer').classList.add('hidden');
      renderGames();
    });

    // Listeners for live input filtering
    document.getElementById('search').addEventListener('input', renderGames);
    document.getElementById('categoryFilter').addEventListener('change', renderGames);

    // Initial load
    loadDirectory();
  </script>
</body>
</html>
